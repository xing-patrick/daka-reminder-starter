name: Build APK

# 出 debug 试用包，构建成功后覆盖更新同一个 Release（下载直链永久固定）。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 发布 Release 需要写权限；其余步骤只需要读
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 项目没有 gradle-wrapper.jar，显式装固定版本，不依赖 action 的版本推断
      - name: Install Gradle 8.7
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt/gradle
          sudo ln -sf /opt/gradle/gradle-8.7/bin/gradle /usr/local/bin/gradle
          gradle --version | head -5

      # 有些镜像不导出 ANDROID_HOME，缺了它 AGP 会直接报 "SDK location not found"
      - name: Ensure Android SDK path
        run: |
          if [ -z "${ANDROID_HOME:-}" ] && [ -d /usr/local/lib/android/sdk ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          fi

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # AGP 8.5 需要 platforms;android-34 + build-tools;34.0.0，缺失时补装
      - name: Ensure SDK components
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager || true)"
          if [ -x "$SM" ]; then
            [ -d "$ANDROID_HOME/platforms/android-34" ] || (yes | "$SM" "platforms;android-34" || true)
            [ -d "$ANDROID_HOME/build-tools/34.0.0" ] || (yes | "$SM" "build-tools;34.0.0" || true)
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # 打出来的包到底是哪个包名，直接打在日志里，避免「改了没生效」这类怀疑
      - name: Show APK package
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          AAPT2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          if [ -x "$AAPT2" ]; then
            echo "APK 包名：$("$AAPT2" dump packagename "$APK" 2>/dev/null || echo '读取失败')"
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daka-reminder-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      # 把 APK 挂到固定的 latest Release 上：直链永久有效、下载不用登录，也不用翻 Actions。
      # 只保留这一条 Release，每次覆盖 asset，下载入口永远是最新包。
      - name: Publish latest APK
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          # 复制成固定文件名再上传：直链里写死 daka.apk，不能依赖构建产物名
          cp "$APK" daka.apk
          ls -lh daka.apk
          TITLE="打卡提醒 试用包 · build ${GITHUB_RUN_NUMBER}"
          NOTE=$(printf '提交 `%s` · 构建于 %s\n\n' "${GITHUB_SHA:0:7}" "$(date -u '+%Y-%m-%d %H:%M UTC')")
          NOTE="${NOTE}这是 **debug 签名**的试用包：装得上，但每次构建签名都不同，换包必须先卸载旧的（打卡记录会清掉）。"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest daka.apk --clobber
            gh release edit latest --title "$TITLE" --notes "$NOTE"
          else
            gh release create latest daka.apk --title "$TITLE" --notes "$NOTE"
          fi
          # 清掉旧名字的包，免得一个 Release 里躺两个 APK 让人选错
          gh release delete-asset latest app-debug.apk -y 2>/dev/null || true
          echo "下载直链：https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/daka.apk"
