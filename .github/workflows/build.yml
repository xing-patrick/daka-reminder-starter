name: Build APK

# 只出 debug 试用包，不发 Release、不签名。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 项目没有 gradle-wrapper.jar，显式装固定版本，不依赖 action 的版本推断
      - name: Install Gradle 8.7
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt/gradle
          sudo ln -sf /opt/gradle/gradle-8.7/bin/gradle /usr/local/bin/gradle
          gradle --version | head -5

      # 有些镜像不导出 ANDROID_HOME，缺了它 AGP 会直接报 "SDK location not found"
      - name: Ensure Android SDK path
        run: |
          if [ -z "${ANDROID_HOME:-}" ] && [ -d /usr/local/lib/android/sdk ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          fi

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # AGP 8.5 需要 platforms;android-34 + build-tools;34.0.0，缺失时补装
      - name: Ensure SDK components
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager || true)"
          if [ -x "$SM" ]; then
            [ -d "$ANDROID_HOME/platforms/android-34" ] || (yes | "$SM" "platforms;android-34" || true)
            [ -d "$ANDROID_HOME/build-tools/34.0.0" ] || (yes | "$SM" "build-tools;34.0.0" || true)
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daka-reminder-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90
